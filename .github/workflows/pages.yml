name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site (web/ + docs/)
        run: |
          mkdir -p _site
          cp -R web/. _site/
          if [ -d docs ]; then
            mkdir -p _site/docs
            cp -R docs/. _site/docs/
          fi
          # Cache-bust the editor JS chain per deploy: stable within a deploy
          # (reloads hit cache — resilient on slow / cross-border networks),
          # changes only when new code ships (fresh fetch once). Falls back to
          # a harmless literal if the marker is ever absent.
          sed -i "s/__HCE_BUILD__/${GITHUB_SHA:0:12}/g" _site/room.html
          sed -i "s/__HCE_BUILD__/${GITHUB_SHA:0:12}/g" _site/index.html
          sed -i "s/__HCE_BUILD__/${GITHUB_SHA:0:12}/g" _site/guide.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
